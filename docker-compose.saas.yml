# Keel — the multi-tenant deployment.
#
# Four long-running services and one image that is built but never started:
#
#   caddy    the only thing with published ports; TLS and Host routing
#   control  tenants, billing, provisioning — holds the Docker socket
#   site     keel.uz: the landing page and the Keel console
#   frontend the shared Next.js process every tenant's site renders through
#   mongo    the control database, and every tenant database beside it
#
# Tenant backends are **not** here. They are created by the control plane, one
# container per customer, on this same network — which is why the network has a
# fixed name and the containers have fixed names: the generated Caddy config
# addresses them by hostname (`keel-<slug>:8080`), and a compose-mangled name
# would leave the edge pointing at nothing.
#
#   docker compose -f docker-compose.saas.yml --profile tenant build
#   docker compose -f docker-compose.saas.yml up -d

name: keel

networks:
  keel:
    name: keel

volumes:
  mongo_data:
  # Caddy's certificates. Losing this means re-issuing every certificate on the
  # next start, and Let's Encrypt's rate limit is per-domain per-week — so this
  # volume is the difference between a restart and an outage.
  caddy_data:
  caddy_config:

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    networks: [keel]
    volumes:
      - mongo_data:/data/db
    environment:
      TZ: ${TZ:-Asia/Tashkent}
    # Deliberately no published port. Every database on this host — ours and
    # every customer's — lives in this one container, and the only things that
    # should be able to reach it are on this network.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    container_name: keel-caddy
    restart: unless-stopped
    networks: [keel]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      TZ: ${TZ:-Asia/Tashkent}

  control:
    build: ./control
    image: keel-control:latest
    # Fixed: the generated Caddy config sends the TLS gate here by name.
    container_name: keel-control
    restart: unless-stopped
    networks: [keel]
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      # How tenants are started. This is root-equivalent access to the host —
      # it is the reason the control plane is a separate service and never
      # something a tenant container can reach.
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only, and only so the console can report free space: without it
      # statfs measures the container's own overlay, which is a different
      # filesystem and a different answer. Nothing writes through this.
      - ${UPLOADS_ROOT:-/srv/keel/tenants}:${UPLOADS_ROOT:-/srv/keel/tenants}:ro
    environment:
      PORT: "9000"
      TZ: ${TZ:-Asia/Tashkent}
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: keel_control
      JWT_SECRET: ${CONTROL_JWT_SECRET:?CONTROL_JWT_SECRET kerak}
      ADMIN_USERNAME: ${KEEL_ADMIN_USERNAME:-keel}
      ADMIN_PASSWORD: ${KEEL_ADMIN_PASSWORD:?KEEL_ADMIN_PASSWORD kerak}
      BASE_DOMAIN: ${BASE_DOMAIN:-keel.uz}
      PRICE_PER_ORDER: ${PRICE_PER_ORDER:-1000}
      TRIAL_DAYS: ${TRIAL_DAYS:-14}
      # Provisioning
      DOCKER_SOCKET: /var/run/docker.sock
      TENANT_IMAGE: keel-tenant:latest
      DOCKER_NETWORK: keel
      # What a tenant container uses to reach Mongo — a name on this network,
      # not the control plane's own URI.
      TENANT_MONGO_HOST: mongodb://mongo:27017
      # A path on the **host**: the Docker daemon resolves tenant bind mounts,
      # not this container.
      UPLOADS_ROOT: ${UPLOADS_ROOT:-/srv/keel/tenants}
      # Which filesystem the console reports free space for. The uploads root
      # is on the host disk and it only ever grows, so it is the one that
      # fills — and it is mounted below so statfs can actually see it.
      DISK_PATH: ${UPLOADS_ROOT:-/srv/keel/tenants}
      # Edge
      CADDY_ADMIN: http://keel-caddy:2019
      CADDY_EMAIL: ${CADDY_EMAIL:?CADDY_EMAIL kerak}
      FRONTEND_HOST: keel-frontend:3000
      CONTROL_HOST: keel-control:9000
      MAIN_UPSTREAM: keel-site:3100
      # Passed through to every tenant container unchanged.
      SMS_PROVIDER: ${SMS_PROVIDER:-demo}
      SMS_FROM: ${SMS_FROM:-}
      ESKIZ_EMAIL: ${ESKIZ_EMAIL:-}
      ESKIZ_PASSWORD: ${ESKIZ_PASSWORD:-}
      MAP_API_KEY: ${NEXT_PUBLIC_MAP_API_KEY:-}

  site:
    build: ./keel-site
    image: keel-site:latest
    container_name: keel-site
    restart: unless-stopped
    networks: [keel]
    environment:
      TZ: ${TZ:-Asia/Tashkent}
      CONTROL_ORIGIN: http://keel-control:9000

  frontend:
    build:
      context: ./frontend
      args:
        # Inlined into the client bundle at build time, so it has to be here
        # rather than in `environment` — one key for every tenant, since this
        # is one build serving all of them.
        NEXT_PUBLIC_MAP_API_KEY: ${NEXT_PUBLIC_MAP_API_KEY:-}
    image: keel-frontend:latest
    container_name: keel-frontend
    restart: unless-stopped
    networks: [keel]
    environment:
      TZ: ${TZ:-Asia/Tashkent}
      # Without these two the image behaves exactly as the single-restaurant
      # product it also is.
      TENANT_MODE: saas
      CONTROL_ORIGIN: http://keel-control:9000

  # Built, never run. The control plane starts one of these per customer.
  # `--profile tenant` keeps `up -d` from trying to run it.
  tenant:
    build: ./backend
    image: keel-tenant:latest
    profiles: [tenant]
    command: ["true"]
