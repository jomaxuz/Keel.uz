# ---- The only file that differs between one restaurant's app and another's ----
#
# ⚠️ **One file, and the build pipeline writes exactly this one.** Everything
# else in this repository is identical for every restaurant — that is the whole
# point of the shape we chose: one codebase, N builds. A pipeline that had to
# edit Gradle, the manifest, a theme and three Kotlin files to brand an app is a
# pipeline whose failures are unreadable and whose diffs cannot be reviewed.
#
# ⚠️ **Checked in with Keel's own values, and they are the development ones.**
# An absent file would fail the build with a message about a missing property,
# which is the wrong lesson: somebody opening this repository should be able to
# run the app. What they get is Keel's demo tenant.
#
# The pipeline additionally drops two things in and touches nothing else:
#   app/src/main/res/mipmap-*/ic_launcher*     — the icon, generated from the logo
#   app/src/main/res/drawable/brand_logo.png   — the splash and the menu header
#
# ⚠️ **Values come from the tenant's own `GET /restaurant`**, never retyped in
# the console: the name, the logo and `theme.brand` are already the restaurant's
# answer to "what do we look like", and a second copy in the build system is a
# second thing that can disagree with the site the guest saw first.

# The Play Store identity. ⚠️ Never changes for a given restaurant: a new id is
# a new application, installed beside the old one, and every guest keeps the
# dead copy on their home screen.
brand.applicationId=uz.keel.guest

# What the launcher says under the icon. Short — Android gives it about twelve
# characters before it truncates on the average home screen.
brand.appName=Keel

# Where this build talks to. ⚠️ Baked in rather than asked for: the staff
# applications open with a server screen because a manager can be told an
# address, and a guest cannot be asked to type one — a guest who is asked
# anything before the menu closes the app.
brand.serverUrl=https://demo.keel.uz

# The restaurant's own accent, from `restaurant.theme.brand`.
#
# ⚠️ **The guest app wears the restaurant's colour, and the staff applications
# wear Keel's orange.** They are different products with different owners: a
# guest is in Navvat's app, a cook is in Keel's tool. This is the one place the
# design module is deliberately overridden — see KeelWaiterTheme's `accent`.
brand.accent=#E2590D

# Play Store version. The pipeline counts it up; nothing here reads it twice.
brand.versionCode=1
brand.versionName=1.0.0
