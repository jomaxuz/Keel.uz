# Rendered-page cache in front of the shared Next.js renderers.
#
# **Why this exists: one restaurant's traffic was slowing down every other
# restaurant's site.** Measured under load — a spike across twenty tenants took
# `kfc.keel.uz/menu` from 0.9 s to 8.7 s, while `keel.uz` (its own container)
# stayed at 0.79 s. The tenant sites share three renderers, so they share one
# queue, and nothing in the design kept a busy neighbour out of it.
#
# Two nginx features do the work, and the second matters more than the first:
#
#   - **A 30-second cache**, keyed per host. A menu that has not changed is
#     rendered once for everybody who asks in that window.
#   - **`proxy_cache_lock`** — request coalescing. A hundred simultaneous
#     requests for the same cold page become **one** render and ninety-nine
#     waiters, instead of a hundred renders fighting for four cores. This is what
#     actually isolates tenants: a burst can no longer multiply into work.
#
# ⚠️ **The cache key starts with `$host`.** One deployment serves every
# customer, so a key without it would serve one restaurant's menu on another
# restaurant's domain — the single worst bug this system could have. Language and
# brand cookies are in the key for the same reason, one step down: they change
# what the page says.
#
# Nothing personal is cached. The bypass list below is every page that belongs to
# one visitor rather than to the public.

proxy_cache_path /var/cache/pages levels=1:2 keys_zone=pages:16m
                 max_size=512m inactive=10m use_temp_path=off;

# The pages that are somebody's own, and the apps behind a login. An optional
# language prefix is allowed for, because `/ru/cart` is as personal as `/cart`.
map $uri $no_cache_path {
    default 0;
    "~^/(ru/|en/)?(admin|kuryer|staff|kiosk)(/|$)"                        1;
    "~^/(ru/|en/)?(cart|checkout|profile|login|order|bron|reservations)(/|$)" 1;
}

upstream renderers {
    least_conn;
    server keel-frontend-1:3000 max_fails=2 fail_timeout=10s;
    server keel-frontend-2:3000 max_fails=2 fail_timeout=10s;
    server keel-frontend-3:3000 max_fails=2 fail_timeout=10s;
    # Kept open: a render is ~300 ms and reconnecting for each one is pure waste.
    keepalive 48;
}

server {
    # Same port the renderers listen on, so the generated Caddy config only had
    # to change hostname.
    listen 3000;
    server_name _;

    # Caddy already logs every request; a second copy of the same lines is only
    # disk. Errors still go to stderr, where `docker logs` finds them.
    access_log off;

    location / {
        proxy_pass http://renderers;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # The tenant is decided by Host, all the way down: Caddy resolves the
        # domain, the renderer asks the control plane which customer it is.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_cache pages;
        # ⚠️ `$host` first — see the note at the top. `$http_accept_encoding` is
        # in the key because what is stored is the encoded body: without it a
        # client that cannot take gzip would be handed a gzipped page. It costs
        # at most two or three copies of each page.
        proxy_cache_key "$host|$request_uri|$cookie_lang|$cookie_brand|$cookie_branch|$http_accept_encoding";

        # Thirty seconds. Long enough that a dinner-time burst is one render,
        # short enough that an owner editing a price sees it before they wonder
        # whether the save worked.
        proxy_cache_valid 200 301 302 30s;
        proxy_cache_valid 404 5s;

        # The isolation, in two directives.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 15s;
        proxy_cache_lock_age 10s;

        # A stale page beats a spinner, and beats a 502: while one request
        # refreshes in the background, everybody else keeps being served.
        proxy_cache_use_stale updating error timeout invalid_header
                              http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;

        # Next sends `no-store` on every page — correct for a browser, wrong for
        # a cache that is part of the application. It is ignored here on purpose,
        # which is exactly why the bypass rules above have to be right.
        proxy_ignore_headers Cache-Control Expires;

        # ⚠️ Never store a response that sets a cookie. A cached `Set-Cookie`
        # would hand one visitor's language — or worse, one visitor's session —
        # to everybody who asked next.
        proxy_no_cache     $no_cache_path $upstream_http_set_cookie;
        proxy_cache_bypass $no_cache_path;

        # HIT / MISS / EXPIRED / STALE / UPDATING — the only way to tell this is
        # working from outside. Kept in production deliberately: it reveals
        # nothing and answers the first question.
        add_header X-Cache $upstream_cache_status always;

        # A render can be slow under load; the timeouts here are longer than the
        # slowest measured page so the cache never turns latency into an error.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # For the deploy script and the compose healthcheck: proves nginx is up
    # without asking a renderer to prove anything.
    location = /_cache_health {
        access_log off;
        return 200 "ok\n";
    }
}
