# Restaurant site + delivery — nginx reverse proxy (single VPS deployment).
#
# Install on the host (not in Docker):
#   sudo cp nginx/restaurant.conf /etc/nginx/sites-available/restaurant.conf
#   sudo ln -s /etc/nginx/sites-available/restaurant.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace traderbot.uz with the restaurant's domain everywhere below.
# TLS certificates are issued by certbot — see DEPLOY.md.
#
# Upstreams are the docker-compose services published on localhost only (see
# docker-compose.prod.yml). The ports must match FRONTEND_PORT / BACKEND_PORT
# in .env — they are not 3000/8080 when the VPS already hosts another site.

upstream restaurant_frontend {
    server 127.0.0.1:3100;
    keepalive 16;
}

upstream restaurant_backend {
    server 127.0.0.1:8090;
    keepalive 16;
}

# ⚠️ **The support chat is a WebSocket, and this map is what lets it live.**
#
# Everything else here is an ordinary request, so the server block below sets
# `Connection ""` — the right header for keeping an upstream connection pooled.
# It is also the exact header that kills an upgrade: nginx forwards the
# handshake as a plain GET, the Go side never upgrades it, and the browser's
# socket closes the moment it opens.
#
# The symptom is not an error anywhere. The help widget reconnects forever and
# says "Aloqa yo'q — qayta ulanmoqda" under a panel that is working perfectly,
# which reads as our chat being broken rather than as a proxy stripping a
# header. Nothing in any log says otherwise: nginx logs a 200, the backend logs
# a refused upgrade it has no reason to shout about.
#
# The map is the standard idiom and it must stay at http level (this file is
# included from `http {}`, so here — beside the upstreams — is the only legal
# place): `Connection: upgrade` for a request that asked to upgrade, and the
# empty value that keeps pooling for everything else.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

# ---- HTTP: ACME challenge + redirect to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name traderbot.uz www.traderbot.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----
server {
    # `listen ... http2` rather than the newer `http2 on;` directive: the latter
    # needs nginx 1.25.1+, and Ubuntu 24.04 still ships 1.24, where it is an
    # "unknown directive" and nginx refuses to start.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name traderbot.uz www.traderbot.uz;

    ssl_certificate     /etc/letsencrypt/live/traderbot.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/traderbot.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Menu photos are uploaded through the admin panel.
    client_max_body_size 12m;

    # Security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # ---- The support chat's live channel ----
    #
    # ⚠️ **Before `/api/`, because nginx takes the longest prefix but the
    # headers are what differ.** This is the one endpoint on the server that is
    # not a request-response, and it needs three things the block below would
    # take away from it.
    #
    # ⚠️ **The read timeout is longer than the long poll, not shorter.** The
    # backend holds a request open against the platform for 40 s and pings the
    # browser every 40 s; at nginx's default 60 s the connection would be cut
    # roughly once a minute all day. Each cut is a reconnect, and the widget
    # would spend its life flickering between "Ulangan" and "Aloqa yo'q".
    location /api/v1/admin/support/ws {
        proxy_pass http://restaurant_backend;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # ⚠️ Off: buffering a stream means a reply reaches the owner's screen
        # when the buffer fills rather than when the operator pressed send,
        # which is the whole feature.
        proxy_buffering off;
    }

    # ---- Go API ----
    location /api/ {
        proxy_pass http://restaurant_backend;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://restaurant_backend;
        access_log off;
    }

    # ---- Uploaded menu photos (served by the Go binary from its volume) ----
    location /uploads/ {
        proxy_pass http://restaurant_backend;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ---- Next.js build assets (content-hashed → cache hard) ----
    location /_next/static/ {
        proxy_pass http://restaurant_frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- Everything else: the Next.js app ----
    location / {
        proxy_pass http://restaurant_frontend;
        proxy_read_timeout 60s;
    }
}
