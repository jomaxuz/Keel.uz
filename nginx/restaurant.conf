# Restaurant site + delivery — nginx reverse proxy (single VPS deployment).
#
# Install on the host (not in Docker):
#   sudo cp nginx/restaurant.conf /etc/nginx/sites-available/restaurant.conf
#   sudo ln -s /etc/nginx/sites-available/restaurant.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace example.uz with the restaurant's domain everywhere below.
# TLS certificates are issued by certbot — see DEPLOY.md.
#
# Upstreams are the docker-compose services published on localhost only
# (see docker-compose.prod.yml): Next.js on 3000, Go API on 8080.

upstream restaurant_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream restaurant_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

# ---- HTTP: ACME challenge + redirect to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name example.uz www.example.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.uz www.example.uz;

    ssl_certificate     /etc/letsencrypt/live/example.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Menu photos are uploaded through the admin panel.
    client_max_body_size 12m;

    # Security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # ---- Go API ----
    location /api/ {
        proxy_pass http://restaurant_backend;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://restaurant_backend;
        access_log off;
    }

    # ---- Uploaded menu photos (served by the Go binary from its volume) ----
    location /uploads/ {
        proxy_pass http://restaurant_backend;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ---- Next.js build assets (content-hashed → cache hard) ----
    location /_next/static/ {
        proxy_pass http://restaurant_frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- Everything else: the Next.js app ----
    location / {
        proxy_pass http://restaurant_frontend;
        proxy_read_timeout 60s;
    }
}
