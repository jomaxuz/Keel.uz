# main ga push bo'lganda traderbot.uz ni yangilaydi.
#
# Serverda hech qanday doimiy GitHub kaliti saqlanmaydi — tashkilot deploy
# key'larni taqiqlagan. Buning o'rniga bu ish o'zining vaqtinchalik
# GITHUB_TOKEN ini serverga uzatadi; server o'sha token bilan `git pull`
# qiladi, token esa ish tugashi bilan kuchini yo'qotadi.
#
# SSH kaliti serverda "forced command" bilan bog'langan: u faqat
# /usr/local/bin/jomaxuz-deploy ni ishga tushira oladi — shell yo'q, port
# forwarding yo'q. Ya'ni kalit sizib ketsa ham, undan qilinadigan yagona ish —
# saytni qayta deploy qilish.

name: Deploy traderbot.uz

on:
  push:
    branches: [main]
  # Qo'lda ham ishga tushirish mumkin (Actions → Run workflow).
  workflow_dispatch:

# Ketma-ket push'lar bir-birining ustiga chiqmasin: oxirgisi kutib turadi.
concurrency:
  group: deploy-traderbot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://traderbot.uz
    steps:
      - name: SSH kalitini tayyorlash
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Serverning kalitini oldindan yozamiz — man-in-the-middle'ga qarshi.
          printf '%s\n' "${{ secrets.DEPLOY_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Serverda deploy
        run: |
          # Keepalive'lar shart: `docker compose build` bir necha daqiqa davom
          # etadi va uzun jim qolgan paytlari bo'ladi. Ular bo'lmasa oradagi
          # NAT/firewall ulanishni uzib qo'yadi, server esa skriptni SIGHUP
          # bilan o'ldiradi — natijada `git pull` o'tgan, build esa
          # tugamagan holat qoladi (aynan shu bir marta sodir bo'ldi:
          # server yangi commit'da turardi-yu, eski image bilan ishlardi).
          ssh -i ~/.ssh/deploy \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=20 \
              -o ServerAliveCountMax=30 \
              root@173.249.8.13 "${{ secrets.GITHUB_TOKEN }}"

      # Saytning javob berishi yetarli emas: eski konteyner ham 200 qaytaradi.
      # Shuning uchun jonli sayt AYNAN shu commit'dan yig'ilganini tekshiramiz.
      - name: Jonli sayt shu commit'dan ekanini tekshirish
        run: |
          for i in $(seq 1 12); do
            live=$(curl -s --max-time 20 https://traderbot.uz/api/v1/health | tr -d '\n' || true)
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://traderbot.uz/ || true)
            sha=$(curl -s --max-time 20 https://traderbot.uz/version.txt || true)
            echo "urinish $i: sayt=$code versiya=$sha"
            if [ "$code" = "200" ] && [ "$sha" = "${GITHUB_SHA}" ]; then
              echo "jonli sayt ${GITHUB_SHA} da"
              exit 0
            fi
            sleep 10
          done
          echo "XATO: sayt hali eski versiyada — deploy tugamagan"
          exit 1
